else if(session.pending&&/confirm|yes|book it/.test(t)){const p=session.pending;const r=await tool('booking',{slot:p.slot,name:p.name,confirmed:true});if(!r)return;session.pending=null;answer='Your sandbox appointment is booked for '+new Date(r.slot).toLocaleString()+'. No external calendar event was created.'}
else if(/book|appointment|available|demo/.test(t)){const r=await tool('appointment_availability',{});if(!r)return;if(!r.slots.length)answer='There are no demo slots remaining. Would you like to leave a handoff request?';else{session.pending={slot:r.slots[0],name:session.name};answer='The next sandbox opening is '+new Date(r.slots[0]).toLocaleString()+'. Should I book it under '+session.name+'? Say “yes, confirm” to reserve it.'}}
else if(/look up|crm|sarah|james/.test(t)){const r=await tool('crm_lookup',{query:/james/.test(t)?'James':'Sarah'});if(!r)return;if(r.contacts.length){session.name=r.contacts[0].name;answer='I found '+r.contacts[0].name+' at '+r.contacts[0].company+'. '+r.contacts[0].notes+' Would you like to check demo availability?'}else answer='I couldn’t find a matching sandbox contact.'}
else if(/email|sms|follow.up/.test(t)){const r=await tool('follow_up',{channel:/sms/.test(t)?'sms':'email',recipient:'Review required',message:'Thank you for your interest in Relay. Please review the transcript and confirm your contact details.'});if(!r)return;answer='I’ve saved a follow-up draft for review. No message was sent.'}
else if(/lead|sign up/.test(t)){const email=text.match(/[^\s@]+@[^\s@]+\.[^\s@]+/);if(email&&/confirm|consent/.test(t)){const named=text.match(/my name is ([^,]+)/i);if(named)session.name=named[1].trim();await tool('lead_creation',{name:session.name,email:email[0],confirmed:true});answer='Your sandbox lead is saved. No external CRM was updated.'}else answer='To create a sandbox lead, provide your name and email and explicitly say you confirm. For example: “My name is Sarah, sarah@example.com, I confirm lead creation.”'}
else if(/price|pricing|cost|product|relay|security/.test(t)){const r=await tool('knowledge_retrieval',{query:text});if(!r)return;answer=r.sources[0].text+' Source: '+r.sources[0].id+'. Would you like to explore a demo?'}else if(/my name is/.test(t)){session.name=text.replace(/.*my name is /i,'').split(/[,\.]/)[0].slice(0,80);answer='Nice to meet you, '+session.name+'. Would you like product information or a demo appointment?'}else answer='I can help with product questions, look up Sarah in the sandbox CRM, check appointment availability, or queue a human handoff. What would you like to do?';if(gen===turn&&session)await say(answer)}catch(e){if(gen===turn&&session)await say('That tool is unavailable: '+e.message+'. We can try again, or you can end the test and review the transcript.')}}
function send(e){if(dc?.readyState==='open')dc.send(JSON.stringify(e))}
async function connectLive(){pc=new RTCPeerConnection();audio=document.createElement('audio');audio.autoplay=true;audio.setAttribute('playsinline','');pc.ontrack=async e=>{audio.srcObject=e.streams[0];try{await audio.play();audioCtx=new AudioContext();await audioCtx.resume();const source=audioCtx.createMediaStreamSource(e.streams[0]);monitor=audioCtx.createAnalyser();monitor.fftSize=256;source.connect(monitor);watchAudio()}catch{toast('Audio playback blocked. Use the page to resume playback.')}};stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});stream.getTracks().forEach(t=>pc.addTrack(t,stream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{state('Listening…');send({type:'response.create',response:{instructions:'Greet the caller briefly and identify yourself as an AI sales rep in a sandbox. Ask how you can help.'}})};dc.onmessage=e=>liveEvent(JSON.parse(e.data));pc.onconnectionstatechange=()=>{if(pc&&['failed','disconnected'].includes(pc.connectionState)&&session){toast('Voice connection lost. Ending safely.');endCall()}};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/api/session',{method:'POST',headers:{'content-type':'application/sdp'},body:offer.sdp,signal:AbortSignal.timeout(25000)});if(!r.ok){const d=await r.json();throw Error(d.error)}await pc.setRemoteDescription({type:'answer',sdp:await r.text()})}
function watchAudio(){if(!session||!monitor)return;const data=new Float32Array(monitor.fftSize);monitor.getFloatTimeDomainData(data);const rms=Math.sqrt(data.reduce((n,x)=>n+x*x,0)/data.length);if(rms>.008){if(!lastAudio)latency();lastAudio=true;speaking=true;state('Ava is speaking…')}else if(rms<.003){lastAudio=false;speaking=false}raf=requestAnimationFrame(watchAudio)}
async function liveEvent(e){if(!session)return;if(e.type==='input_audio_buffer.speech_started'){turn++;aborter?.abort();speechEnd=null;speaking=false;state('Listening…')}
if(e.type==='input_audio_buffer.speech_stopped'){speechEnd=performance.now()-450;state('Thinking…')}
if(e.type==='conversation.item.input_audio_transcription.completed')add('user',e.transcript);
if(e.type==='response.output_audio_transcript.done')add('assistant',e.transcript);
if(e.type==='response.created')activeResponse=true;
if(e.type==='response.done'){activeResponse=false;if(e.response.usage)session.usage.push(e.response.usage);state('Listening…');const gen=turn;const results=await Promise.all((e.response.output||[]).filter(o=>o.type==='function_call').map(async o=>{try{const result=await tool(o.name,JSON.parse(o.arguments),o.call_id);return {id:o.call_id,result}}catch(err){return {id:o.call_id,result:{error:err.message}}}}));if(!session||gen!==turn)return;for(const r of results)send({type:'conversation.item.create',item:{type:'function_call_output',call_id:r.id,output:JSON.stringify(r.result)}});if(results.length)send({type:'response.create'})}
if(e.type==='error')toast('Voice provider: '+e.error.message)}
async function endCall(){if(!session)return;const saved=session;session=null;turn++;clearInterval(timer);aborter?.abort();recognition&&(recognition.onend=null);recognition?.abort();recognition=null;window.speechSynthesis?.cancel();stream?.getTracks().forEach(t=>t.stop());dc?.close();pc?.close();pc=null;dc=null;audio?.pause();if(audio)audio.srcObject=null;cancelAnimationFrame(raf);audioCtx?.close();monitor=null;lastAudio=false;speaking=false;saved.duration=Math.max(1,Math.floor((Date.now()-new Date(saved.date))/1000));records.unshift(saved);document.getElementById('modalroot').innerHTML='';render();try{await api('calls',saved);toast('Call saved. Open it to review the transcript and tool traces.')}catch(e){toast('Call is only in this page: '+e.message)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});init();
</script></body></html>
